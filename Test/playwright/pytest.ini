[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing=retain-on-failure
    --output=test-results
    # Chromium đầy đủ (new headless) mới áp dụng --lang=vi-VN cho thông báo validation HTML5;
    # headless shell mặc định luôn trả tiếng Anh ("Please fill out this field.")
    --browser-channel=chromium

markers =
    ui: Kiểm thử giao diện (hiển thị, trạng thái phần tử, validation message)
    function: Kiểm thử luồng nghiệp vụ end-to-end
    api: Kiểm thử API
    smoke: Bộ test nhanh, chạy mỗi lần deploy
    regression: Bộ test hồi quy đầy đủ
    manual: Test case cần thực hiện thủ công (được skip kèm lý do)
    testcase(id): Liên kết với Test Case ID trong tài liệu
    login: Chức năng Đăng nhập (Login_1..57)
    register: Chức năng Đăng ký (Login_58..256)
    candidate: Đăng ký tài khoản Ứng viên
    recruiter: Đăng ký tài khoản Nhà tuyển dụng

log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file = reports/test.log
log_file_level = INFO
