[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing=retain-on-failure
    --output=test-results
    # Chromium đầy đủ (new headless) mới áp dụng --lang=vi-VN cho thông báo validation HTML5;
    # headless shell mặc định luôn trả tiếng Anh ("Please fill out this field.")
    --browser-channel=chromium

markers =
    ui: Kiểm thử giao diện (hiển thị, trạng thái phần tử, validation message)
    function: Kiểm thử luồng nghiệp vụ end-to-end
    api: Kiểm thử API
    smoke: Bộ test nhanh, chạy mỗi lần deploy
    regression: Bộ test hồi quy đầy đủ
    manual: Test case cần thực hiện thủ công (được skip kèm lý do)
    testcase(id): Liên kết với Test Case ID trong tài liệu
    login: Chức năng Đăng nhập (Login_1..57)
    register: Chức năng Đăng ký (Login_58..256)
    candidate: Đăng ký tài khoản Ứng viên
    recruiter: Đăng ký tài khoản Nhà tuyển dụng
    cv: Toàn bộ chức năng CV của ứng viên (Candidate_1..255)
    cv_list: CV của tôi (Candidate_1..41)
    cv_upload: Tải lên CV (Candidate_42..96)
    cv_builder: Tạo CV (Candidate_97..210)
    cv_analysis: Chấm điểm & gợi ý sửa CV (Candidate_211..255)
    generic: Test chung sinh từ KBKTCN theo mẫu (textbox, combobox, giao diện chung, phân quyền...)
    home: Trang chủ (Home_1..78, 264..265)
    jobs: Tìm kiếm và lọc việc làm (Home_79..174)
    job_detail: Chi tiết tin tuyển dụng (Home_175..199)
    companies: Công ty + Chi tiết công ty (Home_200..263)
    profile: Hồ sơ cá nhân ứng viên (Profile_1..323)
    recommended_jobs: Việc làm phù hợp (Candidate_256..285)
    apply: Ứng tuyển việc làm (Candidate_286..327)
    my_applications: Đơn ứng tuyển của tôi (Candidate_328..383)
    invitations: Thư mời ứng tuyển (Candidate_384..411)
    favorites: Yêu thích (Candidate_412..429)
    recruiter: Toàn bộ chức năng Nhà tuyển dụng (Recruiter_1..766)
    admin: Toàn bộ chức năng Admin (Admin_1..178)
    ai: Cần API AI thật của backend (tự skip khi backend chưa bật AI)

log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file = reports/test.log
log_file_level = INFO
